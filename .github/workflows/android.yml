name: Build S-Calculator APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            python3-pip python3-venv \
            autoconf automake libtool pkg-config \
            build-essential cmake libffi-dev \
            libssl-dev zlib1g-dev

      - name: Install Buildozer
        run: |
          python3 -m pip install --user             buildozer==1.6.0 cython==0.29.34
          echo "$HOME/.local/bin" >> "$GITHUB_PATH" 

      - name: Test calculator
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m py_compile main.py calculator.py

      - name: Pin wheel-aware python-for-android
        run: |
          git clone --quiet https://github.com/kivy/python-for-android.git .p4a-source
          git -C .p4a-source checkout --detach 9562d1b4f306d0af1e76991c711114010dea4152
          python3 - <<'PY'
          from pathlib import Path
          import os
          source = Path(".p4a-source/pythonforandroid/build.py").read_text()
          assert "*platforms, *indices, _env=env" in source, "Expected Android-targeted pip installer missing"
          spec = Path("buildozer.spec")
          content = spec.read_text()
          assert "[buildozer]" in content
          content = content.replace("[buildozer]", "p4a.source_dir = " + os.path.abspath(".p4a-source") + "\n[buildozer]")
          spec.write_text(content)
          print("PASS: pinned Android-targeted pip installer")
          PY

      - name: Build APK
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          "$JAVA_HOME/bin/java" -version
          test "$("$JAVA_HOME/bin/java" -version 2>&1 | head -n 1 | grep -c 'version "17')" -eq 1
          export PATH="$JAVA_HOME/bin:$PATH"
          export PATH="$HOME/.local/bin:$PATH"
          command -v buildozer
          command -v cython
          cython --version
          python3 -m pip --version
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: S-Calculator-Android
          path: bin/*.apk
          if-no-files-found: error
